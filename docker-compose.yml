# ═════ docker-compose.yml ═════
# AI Agent 全栈助手 — Docker 编排

services:
  # ── FastAPI 后端 ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agent-backend
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent-network

  # ── Streamlit 前端 ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: agent-frontend
    environment:
      - API_BASE=http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent-network

  # ── Nginx 反向代理 ──
  nginx:
    image: nginx:alpine
    container_name: agent-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge
